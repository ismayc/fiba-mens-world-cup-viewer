<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Archivo, variable on BOTH axes (width 62-125, weight 400-800). The whole
         app is set in one family used at two extremes: expanded and heavy for
         numerals and headings, normal for text. Loading both axes is what makes
         that possible from a single file. Preconnect first: the font is on the
         critical path for the scoreboard type. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIBA Men's World Cup 2027 — Schedule Viewer</title>
    <meta
      name="description"
      content="All 92 games of the FIBA Men's Basketball World Cup 2027 in Doha, Qatar, in your timezone: scores, the two group stages, standings, and the knockout bracket."
    />
    <meta name="theme-color" content="#15171b" />
    <!-- GitHub Pages is this family's canonical public URL, matching the wnba/nba
         siblings. Netlify is the mirror that also serves /calendar.ics (a Netlify
         function GitHub Pages cannot run). -->
    <link rel="canonical" href="https://ismayc.github.io/fiba-mens-world-cup-viewer/" />

    <!-- PWA: installable to home screen, standalone launch -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FIBA Men's World Cup 2027" />

    <!-- Open Graph (link previews in Slack/Discord/iMessage/Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FIBA Men's World Cup 2027 Schedule Viewer" />
    <meta property="og:title" content="FIBA Men's World Cup 2027 — Schedule Viewer" />
    <meta
      property="og:description"
      content="All 92 games in your timezone: scores, the two group stages, standings, and the knockout bracket."
    />
    <meta property="og:url" content="https://ismayc.github.io/fiba-mens-world-cup-viewer/" />
    <meta property="og:image" content="https://ismayc.github.io/fiba-mens-world-cup-viewer/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FIBA Men's World Cup 2027 Schedule Viewer" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FIBA Men's World Cup 2027 — Schedule Viewer" />
    <meta
      name="twitter:description"
      content="All 92 games in your timezone: scores, the two group stages, standings, and the knockout bracket."
    />
    <meta name="twitter:image" content="https://ismayc.github.io/fiba-mens-world-cup-viewer/og-image.png" />
    <script>
      // Set the theme before paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var t = localStorage.getItem('fmwc:theme')
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
